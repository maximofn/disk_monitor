# Vista Lovelace para el Disk Monitor (formato `sections`, HA 2024+).
#
# Pegar como nueva entrada bajo `views:` en Settings → Dashboards → Edit
# dashboard → tres puntos → Raw configuration editor.

views:
  - type: sections
    title: Disk
    path: disk
    icon: mdi:harddisk
    header:
      card:
        type: markdown
        text_only: true
        content: |
          # {{ states('sensor.disk_monitor_host') }}
          {{ states('sensor.disk_monitor_mount_count') }} mounts
    sections:
      - type: grid
        cards:
          - type: heading
            heading: "/"
            heading_style: title
            icon: mdi:harddisk
          - type: gauge
            entity: sensor.disk_root_used_percent
            name: Uso /
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 70
              red: 90
          - type: tile
            entity: sensor.disk_root_used
          - type: tile
            entity: sensor.disk_root_free
          - type: tile
            entity: sensor.disk_root_total
          - type: tile
            entity: sensor.disk_root_device
          - type: tile
            entity: sensor.disk_root_fs
          - type: tile
            entity: sensor.disk_root_largest_file
          - type: tile
            entity: sensor.disk_root_largest_file_size
          - type: history-graph
            hours_to_show: 72
            grid_options:
              columns: full
            entities:
              - sensor.disk_root_used_percent
              - sensor.disk_root_used

      - type: grid
        cards:
          - type: heading
            heading: "Seagate 2T (/media/wallabot/seagate2T)"
            heading_style: title
            icon: mdi:harddisk
          - type: gauge
            entity: sensor.disk_seagate2t_used_percent
            name: Uso Seagate
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 70
              red: 90
          - type: tile
            entity: sensor.disk_seagate2t_used
          - type: tile
            entity: sensor.disk_seagate2t_free
          - type: tile
            entity: sensor.disk_seagate2t_total
          - type: tile
            entity: sensor.disk_seagate2t_device
          - type: tile
            entity: sensor.disk_seagate2t_fs
          - type: tile
            entity: sensor.disk_seagate2t_largest_file
          - type: tile
            entity: sensor.disk_seagate2t_largest_file_size
          - type: history-graph
            hours_to_show: 72
            grid_options:
              columns: full
            entities:
              - sensor.disk_seagate2t_used_percent
              - sensor.disk_seagate2t_used
